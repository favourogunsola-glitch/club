<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body {
      background-color: #EC9C9D;
      font-family: Arial, sans-serif;
      padding: 30px 15px;
    }
    h1 {
      text-align: center;
      color: #AA7F66;
    }
    .club-card {
      text-align: center;
      border: 2px solid #F2C82A;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #A8B58A;
    }
    .club-card h3 {
      color: #F7C893;
    }
  </style>
</head>
<body>

  <h1>My School Clubs</h1>


  <div class="container">

    
    <div class="row">

      
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Choir</h3>
          <p>A fun club where i get to learn about harmonies and vocal traning.</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Cooking club</h3>
          <p>I learn yummy recipes and cooking techniques</p>
        </div>
      </div>

      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>Robotics club</h3>
          <p>We create innovative achines that help with daily problem solving.</p>
        </div>
      </div>

    </div>
  </div>

  
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>

</body>
</html>
